name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: ai_resume_builder

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai_resume_builder/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
